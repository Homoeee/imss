name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - name: Stage project-local integration components
        run: |
          mkdir -p vendor/tesseract/tessdata
          cp /usr/bin/tesseract vendor/tesseract/tesseract
          cp /usr/share/tesseract-ocr/5/tessdata/eng.traineddata vendor/tesseract/tessdata/
          cp /usr/share/tesseract-ocr/5/tessdata/chi_sim.traineddata vendor/tesseract/tessdata/
      - run: python -m pip install -e .
      - run: python main.py doctor
      - run: python -m unittest discover -s tests -v
