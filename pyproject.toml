[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imss-reimburse"
version = "0.1.0"
description = "Offline Chinese reimbursement material organizer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10.4,<13", "python-docx>=1.1.2,<2", "pypdfium2>=4.30,<6", "lxml>=4.9,<7", "openpyxl>=3.1.5,<4"]

[project.scripts]
imss = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["imss*"]

[tool.setuptools.package-data]
imss = ["resources/templates/*.docx", "resources/templates/*.png"]
